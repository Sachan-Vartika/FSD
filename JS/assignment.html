<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(201, 233, 223);
        }
        h1,h3{
            text-align: center;
        }
        table{
            border-spacing: 10px;
            width: 300px;
            height: 300px;
            padding: 25px;
            background: rgb(231, 122, 7);
            border: 2px solid #555;
            border-radius: 8px;
            margin-left: auto;
            margin-right: auto;
            background-color: rgb(178, 241, 220);
        }
        th{
            text-align: left;
        }
        button {
            text-align: center;
            width: 80px;
            height: 30px;
            margin: auto;
            display: block;
            background-color: rgb(234, 234, 222);
            border: 1px solid #888;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Online Shop</h1>
    <h3>Welcome !!</h3>
    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Rice</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Tea</td>
            <td>500</td>
        </tr>
        <tr>
            <td>Coffee</td>
            <td>300</td>
        </tr>
        <tr>
            <td>Sugar</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Oil</td>
            <td>500</td>
        </tr>
    </table>
    <br>
    <button id="button">Buy Now</button>
    <script>
        const menu={
            Rice :500,
            Tea : 700,
            Coffee : 300,
            Sugar: 100
        }
        document.getElementById("button").innerHTML=Buy Now;
        let a=prompt("Enter your Product Name : ");
        let b= prompt("Enter your Quantity");
        for(let x in menu){
            if(x==a){
                document.write(b*menu[x]);
            }
        }
        
        
    </script>
</body>
</html>
